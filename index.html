        <script>
            // Hiển thị/ẩn modal hướng dẫn sử dụng
            document.addEventListener('DOMContentLoaded', function() {
                var openBtn = document.getElementById('open-guide-btn');
                var modal = document.getElementById('user-guide-modal');
                var closeBtn = document.getElementById('close-guide-btn');
                if(openBtn && modal && closeBtn) {
                    openBtn.onclick = function() { modal.style.display = 'block'; };
                    closeBtn.onclick = function() { modal.style.display = 'none'; };
                    modal.onclick = function(e) { if(e.target === modal) modal.style.display = 'none'; };
                }

                // Tự động làm nổi bật option mới
                let hasNew = false;
                document.querySelectorAll('#quiz-select option[data-new="true"]').forEach(opt => {
                    // Xóa icon cũ nếu có
                    opt.innerHTML = opt.textContent.replace(/^✨\s*/, '');
                    opt.innerHTML = '✨ <span style="color:#e67e22;font-weight:bold;">' + opt.textContent + '</span>';
                    opt.title = 'Nội dung mới vừa được cập nhật!';
                    hasNew = true;
                });

                                // Hiển thị thông báo nổi nếu có nội dung mới
                                var toast = document.getElementById('toast-new-content');
                                if (hasNew && toast) {
                                                        toast.style.display = 'block';
                                                        setTimeout(function(){
                                                            toast.style.opacity = 1;
                                                            toast.style.transform = 'translateY(0)';
                                                        }, 100);
                                    toast.onclick = function() {
                                        document.getElementById('quiz-select').scrollIntoView({behavior:'smooth', block:'center'});
                                        toast.style.display = 'none';
                                    };
                                    // Tự động ẩn sau 8 giây nếu không nhấn
                                    setTimeout(function(){ toast.style.display = 'none'; }, 8000);
                                }
                        });
        </script>
